<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Tea — Digital Menu</title>
<meta name="description" content="Bubble Tea digital menu — Connect with a flavour.">
<meta name="theme-color" content="#FAFCF9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Cairo:wght@400;600&display=swap">
<style>
:root{--sage:#95A395;--pink:#FFCDCC;--cream:#FAFCF9;--ink:#4d5a4d;--soft:#7d8c7d;--r:18px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Josefin Sans','Cairo',system-ui,sans-serif;font-weight:400;-webkit-tap-highlight-color:transparent}
[dir=rtl] body,[dir=rtl] button{font-family:'Cairo','Josefin Sans',sans-serif}
body.lock{overflow:hidden}
button,a{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--sage);outline-offset:3px}
svg{display:block}
/* HERO */
#hero{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .9s ease .25s;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#hero .dots i{position:absolute;border-radius:50%;opacity:0;transform:scale(.6);animation:dotin .9s cubic-bezier(.2,.7,.2,1) forwards;transition:opacity .8s ease,transform .8s ease}
@keyframes dotin{to{opacity:var(--o,1);transform:scale(1)}}
#hero .logo{position:relative;width:min(78vw,420px,56vh);height:auto;z-index:2;transition:opacity .6s,transform .8s}
.touch{position:relative;z-index:2;margin-top:clamp(24px,6vh,56px);display:flex;align-items:center;gap:12px;background:var(--sage);color:var(--cream);padding:12px 26px 12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(149,163,149,.35);animation:pulse 2.8s ease-in-out infinite;transition:opacity .5s}
.touch svg{width:30px;height:30px;flex:none}
.touch b{display:block;font-weight:600;font-size:17px;letter-spacing:.02em;line-height:1.25}
.touch span{display:block;font-size:16px;font-family:'Cairo',sans-serif;line-height:1.3}
@keyframes pulse{50%{transform:scale(1.035)}}
body.open #hero{opacity:0;pointer-events:none}
body.open #hero .dots i{opacity:0!important;transform:scale(.85)!important}
body.open #hero .logo,body.open .touch{opacity:0}
body.open #hero .logo{transform:translateY(-14px)}
/* HEADER */
header{position:sticky;top:0;z-index:30;background:rgba(250,252,249,.96);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;gap:10px}
.mini{width:76px;flex:none;padding:0}
.mini svg{width:100%;height:auto}
.tools{display:flex;align-items:center;gap:8px}
.lang{display:flex;align-items:center;border-radius:999px;background:#fff;border:1px solid #e3e9e3;overflow:hidden}
.lang button{padding:9px 14px;min-height:40px;color:var(--soft);font-size:14px}
.lang button.on{background:var(--sage);color:var(--cream)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px;transition:transform .2s,box-shadow .2s;background:var(--sage);color:var(--cream)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(120,135,120,.25)}
.btn svg{width:20px;height:20px;flex:none}
.btn.pink{background:var(--pink);color:var(--ink)}
.btn.line{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1.5px rgba(250,252,249,.7)}
.wifi{min-height:40px;padding:0 14px;background:var(--pink);color:var(--ink);font-size:14px}
.wifi svg{width:18px;height:18px}
/* NAV */
nav{border-bottom:1px solid #e8eee8}
.cats{max-width:1180px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:8px 12px 10px;scrollbar-width:none;scroll-snap-type:x proximity}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;line-height:1.15;text-align:center;color:var(--soft);scroll-snap-align:center;padding:2px 0}
.cat i{width:50px;height:50px;border-radius:50%;background:var(--pink);display:grid;place-items:center;transition:background .3s,transform .3s}
.cat svg{width:26px;height:26px;stroke:var(--sage);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
.cat.on{color:var(--ink);font-weight:600}
.cat.on i{background:var(--sage);transform:scale(1.08)}
.cat.on svg{stroke:var(--cream)}
/* MENU */
main{max-width:1180px;margin:auto;padding:12px 16px 40px;position:relative}
main::before,main::after{content:"";position:absolute;border-radius:50%;z-index:-1;pointer-events:none}
main::before{width:220px;height:220px;background:var(--pink);opacity:.35;top:140px;inset-inline-end:-90px}
main::after{width:300px;height:300px;background:var(--sage);opacity:.14;top:900px;inset-inline-start:-140px}
section{scroll-margin-top:128px;padding:26px 0 8px}
.tag{display:inline-block;padding:7px 20px;border-radius:999px;font-size:clamp(18px,3.4vw,24px);font-weight:600;letter-spacing:.02em;background:var(--sage);color:var(--cream)}
section:nth-of-type(even) .tag{background:var(--pink);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 10px;margin-top:20px}
.item{text-align:center}
.disc{position:relative;width:min(132px,100%);aspect-ratio:1;margin:0 auto 10px}
.disc::before,.disc::after{content:"";position:absolute;border-radius:50%}
.disc::before{inset:4% 14% 14% 0;background:var(--pink)}
.disc::after{width:42%;height:42%;inset-inline-end:-2%;bottom:0;background:var(--sage);opacity:.85}
.alt .disc::before{background:var(--sage);opacity:.55}
.alt .disc::after{background:var(--pink)}
.disc .pic{position:absolute;inset:6%;z-index:1;border-radius:50%;overflow:hidden;background:var(--cream);display:grid;place-items:center;box-shadow:0 4px 14px rgba(100,115,100,.15)}
.pic img{width:100%;height:100%;object-fit:cover}
.pic svg{width:46%;stroke:var(--sage);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.item h3{margin:0;font-size:15px;font-weight:600;line-height:1.3}
.item p{margin:2px 0 0;font-size:12px;color:var(--soft)}
.price{margin-top:3px;font-size:14px;color:var(--soft);letter-spacing:.03em}
.list{margin:14px 0 0;padding:0;list-style:none;max-width:560px}
.list li{display:flex;align-items:baseline;gap:8px;padding:9px 0;font-size:17px}
.list li::after{content:"";order:1;flex:1;border-bottom:1.5px dotted #c9d3c9;transform:translateY(-4px)}
.list .price{order:2;margin:0;color:var(--ink);font-weight:600;font-size:15px;white-space:nowrap}
.list small{display:block;color:var(--soft);font-size:13px}
.note{max-width:560px;margin:12px 0 0;padding:12px 16px;background:#fff;border-radius:var(--r);border:1px solid #e8eee8;font-size:14px;color:var(--soft);line-height:1.5}
.two{display:grid;gap:0 48px}
/* FOOTER */
footer{max-width:1180px;margin:20px auto 0;padding:0 12px}
.card{position:relative;overflow:hidden;background:var(--sage);color:var(--cream);border-radius:28px;padding:34px 24px;display:grid;gap:28px}
.card::before,.card::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.card::before{width:200px;height:200px;background:var(--pink);opacity:.25;inset-inline-end:-70px;top:-70px}
.card::after{width:140px;height:140px;background:var(--cream);opacity:.1;inset-inline-start:-40px;bottom:-50px}
.card>div{position:relative;z-index:1}
.card h4{margin:0 0 10px;font-size:15px;font-weight:600;letter-spacing:.04em;opacity:.85}
.card p{margin:4px 0;font-size:16px;line-height:1.5}
.card .big{font-size:24px;font-weight:600;margin-bottom:12px}
.social{display:flex;gap:10px;margin-top:6px}
.social a{width:46px;height:46px;border-radius:50%;background:var(--cream);display:grid;place-items:center;transition:transform .2s,background .2s}
.social a:hover{transform:translateY(-2px);background:var(--pink)}
.social svg{width:22px;height:22px;fill:var(--sage);stroke:none}
.social svg.s{fill:none;stroke:var(--sage);stroke-width:1.8}
.hrs{display:flex;justify-content:space-between;gap:16px;max-width:300px}
.credit{text-align:center;padding:22px 16px calc(26px + env(safe-area-inset-bottom,0px));font-size:13px;color:var(--soft);line-height:1.6}
.credit a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--pink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:60;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}.cat{width:92px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(6,1fr);gap:28px 14px}.card{grid-template-columns:1.1fr 1fr 1fr;padding:44px}.two{grid-template-columns:1fr 1fr}.cats{justify-content:center}.item h3{font-size:16px}section{padding-top:34px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important;scroll-behavior:auto!important}#hero .dots i{opacity:var(--o,1);transform:none}}
</style>
</head>

<div id="hero" role="button" tabindex="0" aria-label="Touch to explore the menu">
  <div class="dots" id="dots"></div>
  <svg class="logo" viewBox="0 0 720 580" role="img" aria-label="Bubble Tea — Connect with a flavour"><use href="#lg"/></svg>
  <div class="touch">
    <svg viewBox="0 0 32 32" fill="none" stroke="#FAFCF9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V6.5a2 2 0 0 1 4 0V15m0-2.5a2 2 0 0 1 4 0V15m0-1.2a2 2 0 0 1 4 0V20c0 4-3 7-7 7h-1c-3 0-4.5-1.5-6-4l-3.5-5.5a2 2 0 0 1 3.2-2.3L12 19"/></svg>
    <div><b>Touch to Explore</b><span>المس الشاشة</span></div>
  </div>
</div>

<header>
  <div class="bar">
    <button class="mini" id="home" aria-label="Bubble Tea — back to welcome screen"><svg viewBox="0 0 720 506" role="img" aria-label="Bubble Tea"><use href="#lg"/></svg></button>
    <div class="tools">
      <div class="lang" role="group" aria-label="Language"><button data-l="en" class="on">EN</button><button data-l="ar">عربي</button></div>
      <button class="btn wifi" id="wifi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10.5 10.5 0 0 1 14 0M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg>Wi-Fi</button>
    </div>
  </div>
  <nav aria-label="Menu categories"><div class="cats" id="cats"></div></nav>
</header>

  { id:"hot", icon:"hot", layout:"list", title:L("Hot Drinks"), short:L("Hot Drinks"), items:[
    it("Cappuccino",3.50), it("Espresso",2.50), it("Americano",2.50), it("Café Latte",3.50), it("Spanish Latte",4.00), it("Green Tea",2.50), it("Black Tea",2.50) ]},
  { id:"cold", icon:"snow", layout:"list", title:L("Cold Drinks"), short:L("Cold Drinks"), items:[

  { id:"slush", icon:"slush", layout:"list", title:L("Bubble Tea Slush Line"), short:L("Slush Line"), items:[

  { id:"sandwich", icon:"sandwich", layout:"list", title:L("Signature Sandwiches"), short:L("Sandwiches"), items:[

  { id:"pastries", icon:"pastry", layout:"list", title:L("Desserts & Pastries"), short:L("Pastries"),

    it("Crepe",4.50), it("Mini Pancakes",4.50), it("Signature Pancake Creation",6.00), it("Croissant",4.00) ]},
  { id:"extras", icon:"plus", layout:"list", title:L("Extras"), short:L("Extras"), items:[
    it("Strawberry Boba",0.75), it("Mango Boba",0.75), it("Blueberry Boba",0.75), it("Passion Fruit Boba",0.75), it("Lychee Boba",0.75), it("Cream Cheese",0.50), it("Classic Tapioca Pearls",0.50) ]}
];

/* ============================================================

   ============================================================ */
const ICONS = {
  cup:'<path d="M7 8h10l-1.2 12H8.2L7 8zM6 8c0-2 2.5-3.5 6-3.5S18 6 18 8M13 4.5 14.5 2"/><path d="M9.5 15h.01M12 16.5h.01M14.5 15h.01"/>',
  cake:'<path d="M4 14h16v6H4zM6 14v-3h12v3M12 11V7M12 5.5v.01"/>',
  hot:'<path d="M6 10h10v4a5 5 0 0 1-10 0v-4zM16 11h1.5a2.5 2.5 0 0 1 0 5H16M9 3c-1 1 1 2 0 4M13 3c-1 1 1 2 0 4"/>',
  snow:'<path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9"/>',
  slush:'<path d="M6 9h12l-2 11H8L6 9zM6 9c0-3 3-5 6-5s6 2 6 5M14 5l2-3"/>',
  sandwich:'<path d="M3 11l9-6 9 6M4 13h16M4 17h16M5 17v2h14v-2"/>',
  pastry:'<path d="M4 15c0-4 4-8 8-8s8 4 8 8l-3 1-2-2-3 3-3-3-2 2-3-1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>'
};
const ico = k => `<svg viewBox="0 0 24 24">${ICONS[k]}</svg>`;
const SOCIAL = {
  facebook:'<svg viewBox="0 0 24 24"><path d="M14 8h3V4h-3c-2.8 0-4 1.8-4 4v2H7v4h3v8h4v-8h3l1-4h-4V8.5c0-.3.2-.5.5-.5z"/></svg>',
  instagram:'<svg class="s" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/></svg>',
  snapchat:'<svg viewBox="0 0 24 24"><path d="M12 3c2.8 0 4.5 2 4.5 4.8 0 .8 0 1.4-.1 2 .3.2.8.3 1.3.3.4 0 .8.2.8.6 0 .8-1.5.9-1.8 1.3-.2.3.8 2.6 3.3 3 .3 0 .4.3.2.6-.5.7-1.7.8-2.3.9-.2.4-.1 1-.5 1-.5 0-1.2-.4-2.3-.1-1 .3-1.6 1.8-3.1 1.8s-2.1-1.5-3.1-1.8c-1.1-.3-1.8.1-2.3.1-.4 0-.3-.6-.5-1-.6-.1-1.8-.2-2.3-.9-.2-.3-.1-.6.2-.6 2.5-.4 3.5-2.7 3.3-3-.3-.4-1.8-.5-1.8-1.3 0-.4.4-.6.8-.6.5 0 1-.1 1.3-.3-.1-.6-.1-1.2-.1-2C7.5 5 9.2 3 12 3z"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M16.5 3c.3 2.4 1.7 3.9 4 4.1v3.2c-1.5 0-2.9-.5-4-1.3V15a6 6 0 1 1-6-6c.3 0 .6 0 .9.1v3.3a2.8 2.8 0 1 0 1.9 2.6V3z"/></svg>'
};
const PHONE_I='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
const PIN_I='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const BAG_I='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8zM9 8a3 3 0 0 1 6 0"/></svg>';

let lang = "en";
const tr = o => (o && (o[lang] || o.en)) || "";
const fmt = p => p.toFixed(2) + " " + SITE.currency;

const Button = (cls, href, icon, text, ext) => `<a class="btn ${cls}" href="${href}"${ext ? ' target="_blank" rel="noopener"' : ""}>${icon}${text}</a>`;
const MenuItem = (i, alt) => `<div class="item${alt ? " alt" : ""}"><div class="disc"><div class="pic">${i.img ? `<img src="${i.img}" alt="${tr(i.name)}" loading="lazy">` : ico("cup")}</div></div><h3>${tr(i.name)}</h3>${i.desc ? `<p>${tr(i.desc)}</p>` : ""}<div class="price">${fmt(i.price)}</div></div>`;
const ListRow = i => `<li><span>${tr(i.name)}${i.desc ? `<small>${tr(i.desc)}</small>` : ""}</span><span class="price">${fmt(i.price)}</span></li>`;
const MenuSection = (s, n) => `<section id="${s.id}"><span class="tag">${tr(s.title)}</span>` +
  (s.layout === "cards"
    ? `<div class="grid">${s.items.map((i, k) => MenuItem(i, (n + k) % 2)).join("")}</div>`
    : `<ul class="list">${s.items.map(ListRow).join("")}</ul>${s.note ? `<div class="note">${tr(s.note)}</div>` : ""}`) + `</section>`;
const CategoryNav = () => MENU.map(s => `<button class="cat" data-t="${s.id}"><i>${ico(s.icon)}</i>${tr(s.short)}</button>`).join("");
const SocialLinks = () => `<div class="social">${SITE.social.map(s => `<a href="${s.url}" target="_blank" rel="noopener" aria-label="${s.id}">${SOCIAL[s.id]}</a>`).join("")}</div>`;
const Footer = () => { const u = UI[lang]; return `<div class="card">
  <div><h4>${u.call}</h4><p class="big" dir="ltr" style="text-align:start">${SITE.phone}</p>${Button("line", SITE.phoneHref, PHONE_I, u.call)}<div style="height:18px"></div>${SocialLinks()}</div>
  <div><h4>${u.hours}</h4>${SITE.hours.map(h => `<p class="hrs"><span>${tr(h.label)}</span><span dir="ltr">${tr(h.time)}</span></p>`).join("")}</div>
  <div><div style="display:flex;flex-wrap:wrap;gap:10px">${Button("pink", SITE.deliveryUrl, BAG_I, u.delivery, 1)}${Button("line", SITE.mapsUrl, PIN_I, u.loc, 1)}</div><h4 style="margin-top:22px">${u.addr}</h4><p>${tr(SITE.address)}</p></div>
</div>`; };

function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelector(".touch b").textContent = UI.en.touch;
  document.getElementById("cats").innerHTML = CategoryNav();
  document.getElementById("menu").innerHTML = MENU.map((s, n) => MenuSection(s, n)).join("");
  document.getElementById("footer").innerHTML = Footer();
  document.getElementById("credit").innerHTML = `${UI[lang].by} <a href="${SITE.creditUrl}" target="_blank" rel="noopener">إستوديو أروى عزالدين<br>(Arwa Izzadeen Studio)</a>`;
  document.querySelectorAll("[data-l]").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  observe();
}

/* ============================================================
   BEHAVIOUR
   ============================================================ */

// Hero circles: flat, brand colours only, kept clear of the logo
(function dots() {
  const cols = ["#95A395", "#FFCDCC", "#FAFCF9"], el = document.getElementById("dots");
  let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const placed = []; let html = "", tries = 0;
  while (placed.length < 26 && tries++ < 600) {
    const x = rnd() * 110 - 5, y = rnd() * 110 - 5, d = 10 + rnd() * rnd() * 34 + (rnd() > .85 ? 14 : 0);
    const inCenter = x > 16 && x < 84 && y > 24 && y < 76;
    if (inCenter && rnd() > .12) continue;
    const c = cols[placed.length % 3 === 2 ? (rnd() > .5 ? 0 : 1) : placed.length % 2];
    placed.push(1);
    const col = c === "#FAFCF9" ? "#95A395" : c;
    html += `<i style="top:${y}%;width:${d}vmin;height:${d}vmin;margin-top:-${d / 2}vmin;left:${x}%;margin-left:-${d / 2}vmin;background:${col};--o:${col === "#95A395" ? .78 : .85};animation-delay:${(placed.length * 45)}ms"></i>`;
  }
  el.innerHTML = html;
})();

const hero = document.getElementById("hero");
function openMenu() {
  document.body.classList.add("open"); document.body.classList.remove("lock");
  window.scrollTo({ top: 0, behavior: "instant" });
}
function showHero() {
  window.scrollTo({ top: 0, behavior: "smooth" });
  document.body.classList.remove("open"); document.body.classList.add("lock");
}
hero.addEventListener("click", openMenu);
hero.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openMenu(); } });
document.getElementById("home").addEventListener("click", showHero);

document.getElementById("cats").addEventListener("click", e => {
  const b = e.target.closest(".cat"); if (b) document.getElementById(b.dataset.t).scrollIntoView({ behavior: "smooth" });
});
document.querySelectorAll("[data-l]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.l; render(); }));

// Wi-Fi — replace SITE.wifiUrl with the real auto-connect link
function onWifi() {
  if (!SITE.wifiUrl || SITE.wifiUrl === "#") return toast(UI[lang].wifiToast);
  window.location.href = SITE.wifiUrl;
}
document.getElementById("wifi").addEventListener("click", onWifi);
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600); }

// Active category highlighting
let io;
function observe() {
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    document.querySelectorAll(".cat").forEach(c => {
      const on = c.dataset.t === e.target.id; c.classList.toggle("on", on);
      if (on) { const box = c.parentElement; box.scrollTo({ left: c.offsetLeft - box.clientWidth / 2 + c.clientWidth / 2, behavior: "smooth" }); }
    });
  }), { rootMargin: "-140px 0px -65% 0px" });
  document.querySelectorAll("main section").forEach(s => io.observe(s));
  const f = document.querySelector(".cat"); f && f.classList.add("on");
}
render();
</script>
